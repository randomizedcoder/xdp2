# SPDX-License-Identifier: BSD-2-Clause-FreeBSD
#
# Unified PCAP manifest — Phase 5 of the protocol-coverage-matrix
# plan (see /home/das/.claude/profiles/personal/plans/
# in-this-folder-is-fuzzy-wigderson.md).
#
# This file is the SINGLE SOURCE OF TRUTH for which pcaps under
# data/pcaps/ are included in which gate. It supersedes the
# hardcoded `corpusPcaps` list previously in
# nix/checks/parity-gate.nix.
#
# Consumed by:
#   - nix/checks/parity-gate.nix (via builtins.fromTOML)
#   - nix/scripts/load-pcap-manifest.py (runtime queries)
#
# Adding a pcap: declare it here with `category` and one of:
#   - `included_in = ["parity_gate", ...]`  (gates check on it)
#   - `excluded_from = ["parity_gate"]` + `excluded_reason = "..."`
#     (documents why this pcap is in the tree but not gated)
#
# Selection invariant: the parity-gate output must be a strict
# subset of pcaps where `"parity_gate"` appears in `included_in`.
# Any addition or removal is a contract change visible in
# `git diff data/pcap-manifest.toml`.
#
# The proto_audit pcap_templates corpus (378 single-packet
# templates under samples/proto_audit/pcap_templates/) is NOT
# listed here. The matrix driver globs that directory directly
# because it's auto-generated by helpers/gen_pcap_templates.py
# and grows with every new protocol added to the audit.

schema_version = 1

# ────────────────────────────────────────────────────────────────
# IPv4 / IPv6 plain
# ────────────────────────────────────────────────────────────────

[pcap.tcp_ipv4]
path = "data/pcaps/tcp_ipv4.pcap"
category = "plain-ipv4"
included_in = ["parity_gate"]

[pcap.tcp_ipv6]
path = "data/pcaps/tcp_ipv6.pcap"
category = "plain-ipv6"
included_in = ["parity_gate"]

[pcap.icmp_ipv4]
path = "data/pcaps/icmp_ipv4.pcap"
category = "plain-ipv4"
included_in = ["parity_gate"]

[pcap.icmp_ipv6]
path = "data/pcaps/icmp_ipv6.pcap"
category = "plain-ipv6"
included_in = ["parity_gate"]

[pcap."plain-ipv6-64"]
path = "data/pcaps/plain-ipv6-64.pcap"
category = "plain-ipv6"
included_in = ["parity_gate"]

[pcap.ipv4frags]
path = "data/pcaps/ipv4frags.pcap"
category = "ipv4-fragments"
included_in = ["parity_gate"]

[pcap.protobuf_in_udp]
path = "data/pcaps/protobuf_in_udp.pcap"
category = "udp-payload"
included_in = ["parity_gate"]

[pcap."ipv6-udp-fragmented"]
path = "data/pcaps/ipv6-udp-fragmented.pcap"
category = "ipv6-fragments"
included_in = ["parity_gate"]
# Previously excluded: c-xdp2-mono kept outer IPv6 addrs on
# non-first-fragment packets while OPT/generic followed a flowdis-
# style addr-reset quirk. Resolved 2026-05-18 by the npi_simple
# bswap fix (commit 3ad4ac4): mono's gre-style next_proto dispatch
# was silently dropping out, so it appeared to "keep outer addrs"
# when really it just stopped early.

# ────────────────────────────────────────────────────────────────
# L2 tagging
# ────────────────────────────────────────────────────────────────

[pcap.QinQ]
path = "data/pcaps/QinQ.pcap"
category = "vlan"
included_in = ["parity_gate"]

[pcap.vlan_icmp]
path = "data/pcaps/vlan_icmp.pcap"
category = "vlan"
included_in = ["parity_gate"]
# Single-packet pcap (IPv6 ICMP behind 802.1Q). Previously excluded
# under measurement-noise reasoning, but the rust-graph-enum bswap
# fix + uniform ipv4-only rejection (commits 3ad4ac4, this branch)
# bring the disagreement count to 0. Note: perf measurements on
# this single-packet file remain dominated by clock overhead;
# parity gates correctness only, not perf.

# ────────────────────────────────────────────────────────────────
# Tunnels
# ────────────────────────────────────────────────────────────────

[pcap."6in4"]
path = "data/pcaps/6in4.pcap"
category = "tunnel"
included_in = ["parity_gate"]

[pcap.l7_l2tp]
path = "data/pcaps/l7_l2tp.pcap"
category = "tunnel"
included_in = ["parity_gate"]

[pcap."6to4"]
path = "data/pcaps/6to4.pcap"
category = "tunnel"
excluded_from = ["parity_gate"]
excluded_reason = "Post-fix (2026-05-18): 0 field disagreements but 1 packet rejected by 8 non-flowdis parsers (every XDP2 + Rust parser strict-rejects, only c-flowdis-usp accepts). Cross-implementation strictness mismatch — not a per-parser bug. Tracked separately."

[pcap.ipip]
path = "data/pcaps/ipip.pcap"
category = "tunnel"
included_in = ["parity_gate"]
# Previously 10 disagreements. Resolved 2026-05-18 by the
# npi_simple bswap fix (mono's outer-IP-then-stop bug on the
# IPv4-in-IPv4 chain) plus rust-graph-enum's unified "ipv4-only"
# rejection (IPIP outer is IPv4 but L4=IPPROTO_IPIP is outside the
# enum table). 0 field + 0 accept disagreements verified.

[pcap.l2tp]
path = "data/pcaps/l2tp.pcap"
category = "tunnel"
excluded_from = ["parity_gate"]
excluded_reason = "Post-fix (2026-05-18): 0 field disagreements but 7 packets rejected by c-flowdis-usp while every other parser accepts. The kernel-flowdis port is failing on raw L2TP framing that XDP2 + Rust handle. Use l7_l2tp.pcap for L2TP gate coverage."

[pcap."gre-pptp"]
path = "data/pcaps/gre-pptp.pcap"
category = "tunnel-gre"
excluded_from = ["parity_gate"]
excluded_reason = "Post-triage (2026-05-18): 2 packets, ~212 total disagreement records once all 13 parsers run. Root cause is rust-side: rust-mono/graph/compiled don't walk GRE v1 (PPTP) inner — they stop at outer IPv4 with ip_proto=47. c-flowdis-usp and the c-xdp2-* family all walk to the inner DNS-over-UDP correctly. Both rust and c-xdp2 declare tunnel_behavior=inner so the tunnel mask doesn't fire. Either implement PPTP in rust's parser or add a per-pcap scope exception."

[pcap."gre-sample"]
path = "data/pcaps/gre-sample.pcap"
category = "tunnel-gre"
excluded_from = ["parity_gate"]
excluded_reason = "Post-fix (2026-05-18): 0 field disagreements but 8 packets are accepted only by c-flowdis-usp and rejected by every XDP2 + rust-graph parser. Cross-implementation strictness mismatch (c-flowdis-usp is permissive on malformed GRE)."

[pcap."gre-within-gre"]
path = "data/pcaps/gre-within-gre.pcap"
category = "tunnel-gre"
included_in = ["parity_gate"]
# Previously 628 disagreements. The "deeper nesting" diagnosis was
# wrong: the actual cause was mono's npi_simple bswap (it never
# entered GRE at all) plus rust-graph-enum's split parse-error /
# ipv4-only reject reasons. Resolved 2026-05-18 (commits in this
# branch). 0 field + 0 accept disagreements verified end-to-end.

[pcap.vxlan]
path = "data/pcaps/vxlan.pcap"
category = "tunnel-vxlan"
included_in = ["parity_gate"]
# Was previously 984 disagreements. Resolved 2026-05-18 by:
# (1) proto_vxlan.h: vxlan_proto returns __cpu_to_be16(ETH_P_TEB)
#     so the table lookup matches.
# (2) mono_def.template.c: dropped UDP from R3.4 fast-paths so
#     mono walks into the tunnel via the slow path.
# (3) parity_scope.json: rust-template{,-simd} declared as
#     tunnel_behavior=outer (templates are fixed-offset, can't
#     follow tunnels); eth_{src,dst,proto} added to
#     inner_outer_fields so the tunnel mask catches them.

