[package]
name = "xdp2-compiler"
description = "XDP2 optimizing compiler — graph construction and code generation (Phase 4)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xdp2-rs-compiler"
path = "src/main.rs"

[dependencies]
xdp2-core = { path = "../xdp2-core" }
petgraph = "0.6"
tera = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
