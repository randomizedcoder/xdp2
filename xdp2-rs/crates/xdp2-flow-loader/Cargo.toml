[package]
name = "xdp2-flow-loader"
description = "Userspace loader for the xdp2-flow-ebpf fast-path flow dissector"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xdp2_flow_loader"
path = "src/lib.rs"

[[bin]]
name = "xdp2-flow-loader"
path = "src/bin/xdp2-flow-loader.rs"

[dependencies]
# libc covers errno/c-string plumbing for the hand-written FFI layer in
# src/libbpf_sys.rs. We link against the system libbpf directly rather
# than pulling libbpf-sys/libbpf-rs so the crate builds offline.
libc = "0.2"
