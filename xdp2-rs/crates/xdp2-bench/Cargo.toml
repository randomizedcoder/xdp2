[package]
name = "xdp2-bench"
description = "XDP2 parse engine benchmark — C vs Rust performance comparison"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xdp2-bench"
path = "src/main.rs"

[lib]
name = "xdp2_bench"
path = "src/lib.rs"

[dependencies]
xdp2-core = { path = "../xdp2-core" }
xdp2-protocols = { path = "../xdp2-protocols" }
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
perf-event = "0.4"
libc = "0.2"
xdp2-af-xdp = { path = "../xdp2-af-xdp" }
