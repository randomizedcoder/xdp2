[package]
name = "xdp2-bench"
description = "XDP2 parse engine benchmark — C vs Rust performance comparison"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xdp2-bench"
path = "src/main.rs"

[lib]
name = "xdp2_bench"
path = "src/lib.rs"

[features]
# Experimental enum-dispatch graph engine — builds an additional CLI mode
# (`--mode graph-enum`) that runs the parse loop via static-dispatch match
# instead of `&dyn ParseNodeDyn`. Enables `xdp2-core/enum-dispatch`.
# See docs/performance-next-steps.md ("Option A").
default = ["graph-enum"]
graph-enum = ["xdp2-core/enum-dispatch"]

[dependencies]
xdp2-core = { path = "../xdp2-core" }
xdp2-protocols = { path = "../xdp2-protocols" }
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
perf-event = "0.4"
libc = "0.2"
xdp2-af-xdp = { path = "../xdp2-af-xdp" }
