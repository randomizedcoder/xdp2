[package]
name = "xdp2-core"
description = "XDP2 parse graph engine — core types, traits, and runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enables the parallel enum-dispatch engine (`xdp2_core::enum_dispatch`).
# This is an experimental alternative to the dyn-dispatch graph engine that
# monomorphizes the parse loop over a user-provided node enum, eliminating
# vtable indirection. See docs/performance-next-steps.md ("Option A").
enum-dispatch = []

[dependencies]
zerocopy = { workspace = true }
bitflags = { workspace = true }

[dev-dependencies]
