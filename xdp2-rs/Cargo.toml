[workspace]
members = ["crates/xdp2-core", "crates/xdp2-protocols", "crates/xdp2-compiler", "crates/xdp2-bench", "crates/xdp2-af-xdp", "crates/xdp2-fuzz", "crates/xdp2-flow-loader", "crates/xdp2-fastpath-control"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause-FreeBSD"

[workspace.dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
bitflags = "2"

[profile.release]
lto = "fat"         # Full cross-crate optimization (protocol Ops in xdp2-protocols → parse loop in xdp2-core)
codegen-units = 1   # Single codegen unit for maximum optimization
panic = "abort"     # No unwind tables — smaller binary, eliminates landing-pad overhead
